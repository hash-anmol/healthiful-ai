<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120b0e"><style>html,body{margin:0;height:100%;background:#120b0e;color-scheme:dark}[hidden]{display:none!important}</style></head><body><title>Lalita Sadhana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700&family=Tiro+Devanagari+Sanskrit&display=swap">
<style>/* Layout: the 3D hut fills the screen; a glass panel sits to the right on iPad landscape,
   at the bottom in portrait. Single committed night palette (lamp-lit hut). */
:root {
  --night: #120b0e;
  --night-2: #1c1216;
  --glass: rgba(26, 15, 18, 0.74);
  --glass-hi: rgba(44, 26, 28, 0.82);
  --ink: #f4e7d4;
  --ink-2: #d8c3a8;
  --muted: #a28b76;
  --kumkum: #c8372d;
  --kumkum-deep: #8e1f1a;
  --haldi: #eaa93b;
  --brass: #caa055;
  --leaf: #8fae63;
  --line: rgba(244, 231, 212, 0.12);
  --line-2: rgba(244, 231, 212, 0.22);
  --f-deva: "Tiro Devanagari Sanskrit", "Kohinoor Devanagari", "Noto Serif Devanagari", serif;
  --f-ui: "Mukta", "Kohinoor Devanagari", -apple-system, system-ui, sans-serif;
  --mantra-scale: 1;
  --r: 18px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 30% 40%, #3a1d14 0%, var(--night) 60%) var(--night);
  color: var(--ink);
  font: 400 17px/1.5 var(--f-ui);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--haldi); outline-offset: 2px; border-radius: 8px; }
.deva { font-family: var(--f-deva); }
.num { font-variant-numeric: tabular-nums; }

#scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; }
#app { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; pointer-events: none; }
#app > * { pointer-events: auto; }

/* top bar */
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-bottom: 6px; pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
.brand .mark { font-family: var(--f-deva); font-size: 26px; color: var(--haldi); line-height: 1; }
.brand b { font-weight: 500; letter-spacing: .06em; font-size: 14px; color: var(--ink-2); }
.top-actions { display: flex; gap: 8px; align-items: center; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; background: rgba(0,0,0,.25); }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.cloud i { background: var(--leaf); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.3); border: 1px solid var(--line); }
.icon-btn svg { width: 20px; height: 20px; }

main { flex: 1; position: relative; min-height: 0; pointer-events: none; }
.view { position: absolute; inset: 0; pointer-events: none; }
.view > * { pointer-events: auto; }

/* tabs */
#tabs {
  align-self: center; display: flex; gap: 4px; padding: 6px; margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  background: rgba(22,13,16,.92);
  border: 1px solid var(--line); border-radius: 99px;
}
#tabs button { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 99px; color: var(--ink-2); font-weight: 500; min-height: 46px; }
#tabs button svg { width: 18px; height: 18px; }
#tabs button.on { background: rgba(234,169,59,.18); color: #ffe3b0; }

/* full pages (vidhi / naam / yatra) */
.page {
  box-sizing: border-box; left: auto; right: 0; top: 0; bottom: 0; width: min(720px, 60vw);
  padding-top: calc(env(safe-area-inset-top, 0px) + 84px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 110px);
  padding-left: 120px; padding-right: max(44px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to left, rgba(12,6,8,.97) 0%, rgba(12,6,8,.95) 78%, rgba(12,6,8,0) 100%);
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none;
  pointer-events: auto; touch-action: pan-y;
}
.page::-webkit-scrollbar { display: none; }
.page-in { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 22px; }
.page h1 { font-weight: 600; font-size: 30px; margin: 6px 0 0; line-height: 1.15; text-wrap: balance; }
.page .lead { color: var(--ink-2); max-width: 65ch; margin: 0; }
.sec-h { display: flex; align-items: baseline; gap: 12px; border-top: 1px solid var(--line-2); padding-top: 18px; margin-top: 10px; flex-wrap: wrap; }
.sec-h h2 { margin: 0; font-size: 22px; font-weight: 600; }
.sec-h .deva { color: var(--haldi); font-size: 20px; }
.sec-h .n { margin-left: auto; color: var(--muted); font-size: 14px; }
.vstep { display: grid; grid-template-columns: 48px 1fr; gap: 6px 16px; }
.vstep .no { font-family: var(--f-deva); font-size: 30px; color: var(--brass); line-height: 1; padding-top: 2px; }
.vstep h3 { margin: 0; font-size: 20px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.vstep h3 .deva { font-weight: 400; color: var(--ink-2); font-size: 18px; }
.vstep .body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.vstep p { margin: 0; max-width: 65ch; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: rgba(234,169,59,.16); color: #f6d39a; font-weight: 600; letter-spacing: .04em; }
.mantra { border-left: 2px solid var(--kumkum); padding: 8px 0 8px 16px; display: flex; flex-direction: column; gap: 6px; }
.mantra .d { font-family: var(--f-deva); font-size: calc(21px * var(--mantra-scale)); line-height: 1.65; white-space: pre-line; color: #ffeccc; }
.mantra .r { color: var(--ink-2); font-size: calc(15px * var(--mantra-scale)); white-space: pre-line; font-style: italic; }
.mantra .k { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.mantra .how { font-size: 14px; color: var(--muted); }
.bhaav { color: var(--ink-2); font-style: italic; font-size: 15px; display: flex; gap: 8px; }
.bhaav svg { flex: none; width: 18px; height: 18px; margin-top: 3px; color: var(--haldi); }
.samagri { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.samagri div { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.samagri b { display: block; font-weight: 600; }
.samagri span { font-size: 13px; color: var(--muted); }

/* naam list */
.search { position: sticky; top: 0; z-index: 2; padding-block: 8px; background: linear-gradient(rgba(14,8,10,.95) 70%, rgba(14,8,10,0)); }
.search input { width: 100%; background: rgba(0,0,0,.35); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px 16px; min-height: 52px; outline: none; }
.nlist { display: flex; flex-direction: column; }
.nrow { display: grid; grid-template-columns: 56px 1fr; gap: 2px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.nrow .i { color: var(--brass); font-size: 14px; padding-top: 6px; }
.nrow .d { font-family: var(--f-deva); font-size: 22px; color: #ffeccc; overflow-wrap: anywhere; }
.nrow .r { color: var(--ink-2); font-style: italic; font-size: 14px; overflow-wrap: anywhere; }
.nrow .m { grid-column: 2; color: var(--muted); font-size: 14px; }
.nrow > div { min-width: 0; }

/* yatra */
.cal { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.cal div { aspect-ratio: 1; max-width: 100%; border-radius: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); background: rgba(0,0,0,.2); }
.cal div b { font-size: 18px; color: var(--ink-2); font-weight: 600; }
.cal div.lit { background: radial-gradient(circle at 50% 35%, rgba(255,215,140,.35), rgba(234,169,59,.12) 60%); border-color: rgba(234,169,59,.5); }
.cal div.lit b { color: #ffe3b0; }
.cal div.miss { background: rgba(200,55,45,.15); border-color: rgba(200,55,45,.5); }
.cal div.today { outline: 2px solid var(--haldi); outline-offset: 1px; }
.medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.medal { border-radius: 16px; padding: 14px; border: 1px solid var(--line); background: rgba(0,0,0,.2); display: flex; flex-direction: column; gap: 4px; opacity: .45; }
.medal.on { opacity: 1; border-color: rgba(234,169,59,.5); background: linear-gradient(160deg, rgba(234,169,59,.18), rgba(0,0,0,.2)); }
.medal .g { font-family: var(--f-deva); font-size: 26px; color: var(--haldi); line-height: 1; }
.medal b { font-weight: 600; }
.medal span { font-size: 13px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 140px 1fr 64px; gap: 10px; align-items: center; font-size: 14px; }
.bar .tr { height: 10px; background: rgba(255,255,255,.05); border-radius: 99px; overflow: hidden; }
.bar .tr span { display: block; height: 100%; border-radius: 99px; }
.bar .v { text-align: right; color: var(--ink-2); }
.hist { display: flex; flex-direction: column; }
.hist div { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; flex-wrap: wrap; }
.hist span { color: var(--muted); }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(8,4,6,.72); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.dialog { width: min(560px, 100%); max-height: calc(100% - 40px); overflow-y: auto; background: var(--night-2); border: 1px solid var(--line-2); border-radius: 26px; padding: 26px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 40px 80px -30px #000; }
.dialog h2 { margin: 0; font-size: 26px; font-weight: 600; }
.done-hero { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.done-hero .deva { font-size: 30px; color: var(--haldi); }
.done-hero .big { font-size: 56px; font-weight: 600; line-height: 1; }
.sheet-sec { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
.sheet-sec h3 { margin: 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; }
.sw { width: 52px; height: 30px; border-radius: 99px; background: rgba(244,231,212,.15); position: relative; flex: none; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #f4e7d4; transition: transform .2s; }
.sw.on { background: var(--leaf); }
.sw.on::after { transform: translateX(22px); }
textarea.backup { width: 100%; min-height: 90px; font-size: 12px; font-family: ui-monospace, monospace; }

#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); transform: translateX(-50%) translateY(20px); opacity: 0; transition: .3s; z-index: 30; background: var(--night-2); border: 1px solid var(--line-2); padding: 12px 20px; border-radius: 99px; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
#toast.on { opacity: 1; transform: translateX(-50%); }



/* shared small pieces (guide, journey, dialogs) */
.eyebrow { font-size: 13px; letter-spacing: .08em; color: var(--haldi); font-weight: 500; }
.hint { font-size: 14px; color: var(--muted); margin: 0; line-height: 1.55; }
.card { background: rgba(0,0,0,.22); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.card h3 { margin: 0; font-size: 13px; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.stat { background: rgba(0,0,0,.2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
.stat b { display: block; font-size: 24px; font-weight: 600; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--muted); }
.naam-card .nd { font-family: var(--f-deva); font-size: 30px; line-height: 1.2; color: #ffe3b0; }
.naam-card .nr { color: var(--ink-2); font-style: italic; }
.naam-card .nm { color: var(--ink-2); font-size: 15px; }

/* ---------- the focused column (home and session) ---------- */
.side {
  box-sizing: border-box; position: absolute; right: 0; top: 0; bottom: 0; width: min(660px, 56vw); display: flex; flex-direction: column;
  padding-top: calc(env(safe-area-inset-top, 0px) + 84px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 104px);
  padding-left: 140px; padding-right: max(44px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to left, rgba(12,6,8,.95) 0%, rgba(12,6,8,.92) 72%, rgba(12,6,8,0) 100%);
  overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.side::-webkit-scrollbar { display: none; }
.side .inner { margin-block: auto; display: flex; flex-direction: column; gap: 26px; align-items: flex-start; width: 100%; }
.meta { font-size: 14px; color: var(--muted); letter-spacing: .03em; }
.h-title { font-family: var(--f-deva); font-weight: 400; font-size: 44px; line-height: 1.05; margin: 0; text-wrap: balance; }
.day { display: flex; align-items: baseline; gap: 14px; }
.day b { font-family: var(--f-deva); font-weight: 400; font-size: 104px; line-height: .9; }
.day span { color: var(--muted); font-size: 22px; }
.line { margin: 0; font-size: 19px; line-height: 1.5; color: var(--ink-2); max-width: 32ch; }
.line b { color: var(--ink); font-weight: 600; }
.quiet { margin: 0; font-size: 15px; color: var(--muted); line-height: 1.55; max-width: 40ch; }
.link { color: var(--haldi); text-decoration: underline; text-underline-offset: 4px; font-weight: 500; padding: 4px 0; font-size: 16px; }
.alert { border-left: 2px solid var(--kumkum); padding: 2px 0 2px 16px; display: flex; flex-direction: column; gap: 10px; max-width: 40ch; }
.alert p { margin: 0; font-size: 17px; }
.row { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
details.inc summary { cursor: pointer; color: var(--muted); font-size: 15px; list-style: none; padding: 6px 0; }
details.inc summary::-webkit-details-marker { display: none; }
details.inc summary::after { content: " +"; color: var(--haldi); }
details.inc[open] summary::after { content: " –"; }
.inc-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; min-width: min(340px, 100%); }
.inc-list div { display: flex; justify-content: space-between; gap: 24px; font-size: 16px; color: var(--ink-2); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.inc-list i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; padding: 0 38px; border-radius: 99px; font-weight: 600; font-size: 19px; transition: transform .15s ease, background .2s; }
.btn:active { transform: scale(.98); }
.btn-primary { background: linear-gradient(180deg, #d9443a, var(--kumkum-deep)); color: #fff5ea; box-shadow: 0 12px 30px -12px rgba(200,55,45,.85), inset 0 1px 0 rgba(255,255,255,.2); }
.btn-gold { background: linear-gradient(180deg, #f2bd55, #b9781e); color: #2a1406; }
.btn-ghost { background: rgba(244,231,212,.08); border: 1px solid var(--line-2); }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn-sm { min-height: 44px; padding: 0 20px; font-size: 16px; }
.btn-block { width: 100%; }
.round { width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center; background: rgba(244,231,212,.08); border: 1px solid var(--line-2); font-size: 24px; }
.round svg { width: 22px; height: 22px; }

/* guided setup */
.q { font-family: var(--f-deva); font-size: 36px; line-height: 1.15; margin: 0; font-weight: 400; text-wrap: balance; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { min-height: 54px; padding: 0 26px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--ink-2); font-size: 18px; }
.seg button.on { background: rgba(234,169,59,.18); border-color: var(--haldi); color: #ffe3b0; }
.stepper { display: flex; align-items: center; gap: 22px; }
.stepper b { font-family: var(--f-deva); font-weight: 400; font-size: 72px; min-width: 2ch; text-align: center; line-height: 1; }
.fields { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 420px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; color: var(--muted); }
.field input, .field textarea { background: rgba(0,0,0,.32); border: 1px solid var(--line-2); border-radius: 14px; padding: 12px 16px; min-height: 52px; outline: none; font-size: 17px; width: 100%; }
.field input:focus, .field textarea:focus { border-color: var(--haldi); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.dots { display: flex; gap: 8px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(244,231,212,.2); }
.dots i.on { background: var(--haldi); }

/* session */
#session { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
#session > * { pointer-events: auto; }
.s-top { z-index: 2; position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 22px; padding-top: calc(env(safe-area-inset-top, 0px) + 14px); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.s-top > * { pointer-events: auto; }
.s-top .round { width: 46px; height: 46px; background: rgba(0,0,0,.35); }
.track { display: flex; gap: 6px; align-items: center; min-width: 0; }
.track .seg-t { flex: var(--w); height: 4px; border-radius: 99px; background: rgba(244,231,212,.14); overflow: hidden; position: relative; }
.track .seg-t span { position: absolute; inset: 0; width: var(--p); background: var(--haldi); border-radius: 99px; transition: width .4s ease; }
.clock { text-align: right; font-size: 13px; color: var(--muted); line-height: 1.3; text-shadow: 0 1px 8px #000; }
.clock b { display: block; color: var(--ink); font-size: 20px; font-weight: 500; }
.stage { padding-top: calc(env(safe-area-inset-top, 0px) + 76px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 36px); }
.stage .inner { gap: 22px; }
.stage.is-paath .inner { gap: 14px; }
.stage.is-paath .names-page div { padding: 4px 0; }
.stage.is-paath .names-page .d { font-size: calc(23px * var(--mantra-scale)); line-height: 1.3; }
.stage h2 { font-family: var(--f-deva); font-weight: 400; font-size: 38px; line-height: 1.12; margin: 0; text-wrap: balance; }
.cue { margin: 0; font-size: 20px; line-height: 1.45; color: var(--ink-2); max-width: 30ch; }
.cue.action { color: #ffd98a; }
.pg { display: flex; flex-direction: column; gap: 14px; animation: rise .35s ease; width: 100%; }
@keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
.pg .d { font-family: var(--f-deva); font-size: calc(36px * var(--mantra-scale)); line-height: 1.7; color: #ffeccc; white-space: pre-line; }
.pg .r { font-size: calc(17px * var(--mantra-scale)); line-height: 1.6; color: var(--ink-2); font-style: italic; white-space: pre-line; opacity: .85; }
.pg .en { font-size: calc(20px * var(--mantra-scale)); line-height: 1.6; color: var(--ink); max-width: 36ch; }
.pg .d.long { font-size: calc(28px * var(--mantra-scale)); }
.stage-foot { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 4px; }
.stage-foot .btn-next { flex: 1; }
.figure { display: flex; align-items: center; gap: 18px; }
.figure svg { width: 92px; height: 108px; flex: none; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; width: 100%; }
.check { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left; min-height: 56px; width: 100%; }
.check i { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-2); flex: none; display: grid; place-items: center; }
.check.on i { background: var(--leaf); border-color: var(--leaf); }

<script>const NAMES=[["श्रीमाता","Shreemaataa","She who is the auspicious Mother"],["श्रीमहाराज्ञी","Shreemahaaraajnee","She who is the Empress of the Universe"],["श्रीमत्सिंहासनेश्वरी","Shreematsimhaasaneshvaree","She who is the queen of the most glorious throne"],["चिदग्निकुण्डसम्भूता","Chidagnikundasambhootaa","She who was born in the fire-pit of Pure Consciousness"],["देवकार्यसमुद्यता","Devakaaryasamudyataa","She who is intent on fulfilling the wishes of the gods"],["उद्यद्भानुसहस्राभा","Udyadbhaanusahasraabhaa","She who has the radiance of a thousand rising suns"],["चतुर्बाहुसमन्विता","Chaturbaahusamanvitaa","She who is four-armed"],["रागस्वरूपपाशाढ्या","Raagasvaroopapaashaadhyaa","She who is holding the rope of love in Her hand"],["क्रोधाकाराङ्कुशोज्ज्वला","Krodhaakaaraankushojjvalaa","She who shines, bearing the goad of anger"],["मनोरूपेक्षुकोदण्डा","Manoroopekshukodandaa","She who holds in Her hand a sugarcane bow that represents the mind"],["पञ्चतन्मात्रसायका","Panchatanmaatrasaayakaa","She who holds the five subtle elements as arrows"],["निजारुणप्रभापूरमज्जद्ब्रह्माण्डमण्डला","Nijaarunaprabhaapooramajjadbrahmaandamandalaa","she who immerses the entire universe in the red efflugence of Her form"],["चम्पकाशोकपुन्नागसौगन्धिकलसत्कचा","Champakaashokapunnaagasaugandhikalasatkachaa","She whose hair has been adorned with flowers like campaka, ashoka, punnaga and saugandhika"],["कुरुविन्दमणिश्रेणीकनत्कोटीरमण्डिता","Kuruvindamanishreneekanatkoteeramanditaa","She who is resplendent with a crown adorned with rows of kuruvinda gems"],["अष्टमीचन्द्रविभ्राजदलिकस्थलशोभिता","Ashtameechandravibhraajadalikasthalashobhitaa","She whose forehead shines like the crescent moon of the eighth night of the lunar half-month"],["मुखचन्द्रकलङ्काभमृगनाभिविशेषका","Mukhachandrakalankaabhamriganaabhivisheshakaa","She who wears a musk mark on Her forehead which shines like the spot in the moon"],["वदनस्मरमाङ्गल्यगृहतोरणचिल्लिका","Vadanasmaramaangalyagrihatoranachillikaa","She whose eyebrows shine like the archways leading to the house of kama, the god of love, which Her face resembles"],["वक्त्रलक्ष्मीपरीवाहचलन्मीनाभलोचना","Vaktralakshmeepareevaahachalanmeenaabhalochanaa","She whose eyes possess the luster of the fish that move about in the stream of beauty flowing from Her face"],["नवचम्पकपुष्पाभनासादण्डविराजिता","Navachampakapushpaabhanaasaadandaviraajitaa","She who is resplendent with a nose that has the beauty of a newly blossoming campaka flower"],["ताराकान्तितिरस्कारिनासाभरणभासुरा","Taaraakaantitiraskaarinaasaabharanabhaasuraa","She who shines with a nose-ornament that excels the luster of a star"],["कदम्बमञ्जरीक्लृप्तकर्णपूरमनोहरा","Kadambamanjareeklriptakarnapooramanoharaa","She who is captivating, wearing bunches of kadamba flowers as ear-ornaments"],["ताटङ्कयुगलीभूततपनोडुपमण्डला","Taatankayugaleebhootatapanodupamandalaa","She who wears the sun and the moon as a pair of large earrings"],["पद्मरागशिलादर्शपरिभाविकपोलभूः","Padmaraagashilaadarshaparibhaavikapolabhooh","She whose cheeks excel mirrors made of rubies in their beauty"],["नवविद्रुमबिम्बश्रीन्यक्कारिरदनच्छदा","NavavidrumabimbashreenyakkaariradanachChadaa","She whose lips excel freshly cut coral and bimba fruit in their reflective splendor"],["शुद्धविद्याङ्कुराकारद्विजपङ्क्तिद्वयोज्ज्वला","Shuddhavidyaankuraakaaradvijapanktidvayojjvalaa","She who has radiant teeth which resemble the buds of pure knowledge"],["कर्पूरवीटिकामोदसमाकर्षिदिगन्तरा","Karpooraveetikaamodasamaakarshidigantaraa","She who is enjoying a camphor-laden betel roll, the fragrance of which is attracting people from all directions"],["निजसल्लापमाधुर्यविनिर्भर्त्सितकच्छपी","NijasallaapamaadhuryavinirbhartsitakachChapee","She who excels even the veena of sarasvati in the sweetness of Her speech"],["मन्दस्मितप्रभापूरमज्जत्कामेशमानसा","Mandasmitaprabhaapooramajjatkaameshamaanasaa","She who submerges even the mind of KAmesha(Lord shiva) in the radiance of Her smile"],["अनाकलितसादृश्यचिबुकश्रीविराजिता","Anaakalitasaadrishyachibukashreeviraajitaa","She whose chin cannot be compared to anything(it is beyond camporison because of its unparalleled beauty)"],["कामेशबद्धमाङ्गल्यसूत्रशोभितकन्धरा","Kaameshabaddhamaangalyasootrashobhitakandharaa","She whose neck is adorned with the marriage thread tied by KAmesha"],["कनकाङ्गदकेयूरकमनीयभुजान्विता","Kanakaangadakeyoorakamaneeyabhujaanvitaa","She whose arms are beautifully adorned with golden armlets"],["रत्नग्रैवेयचिन्ताकलोलमुक्ताफलान्विता","Ratnagraiveyachintaakalolamuktaaphalaanvitaa","She whose neck is resplendent with a gem-studded necklace with a locket made of pearl"],["कामेश्वरप्रेमरत्नमणिप्रतिपणस्तनी","Kaameshvarapremaratnamanipratipanastanee","She who gives Her breasts to KAmeshvara in return for the gem of love He bestows on Her"],["नाभ्यालवालरोमालिलताफलकुचद्वयी","Naabhyaalavaalaromaalilataaphalakuchadvayee","She whose breasts are the fruits on the creeper of the fine hairline that starts in the depths of Her navel and spreads upwards"],["लक्ष्यरोमलताधारतासमुन्नेयमध्यमा","Lakshyaromalataadhaarataasamunneyamadhyamaa","She who has a waist, the existence of which can only be inferred by the fact that the creeper of Her hairline springs from it"],["स्तनभारदलन्मध्यपट्टबन्धवलित्रया","Stanabhaaradalanmadhyapattabandhavalitrayaa","She whose abdomen has three folds which form a belt to support Her waist from breaking under the weight of Her breasts"],["अरुणारुणकौसुम्भवस्त्रभास्वत्कटीतटी","Arunaarunakausumbhavastrabhaasvatkateetatee","She whose hips are adorned with a garment as red as the rising sun, which is dyed with an extract from safflower (kusumbha) blossoms"],["रत्नकिङ्किणिकारम्यरशनादामभूषिता","Ratnakinkinikaaramyarashanaadaamabhooshitaa","She who is adorned with a girdle which is decorated with many gem-studded bells"],["कामेशज्ञातसौभाग्यमार्दवोरुद्वयान्विता","Kaameshajnaatasaubhaagyamaardavorudvayaanvitaa","The beauty and softness of whose thighs are known only to kamesha, Her husband"],["माणिक्यमकुटाकारजानुद्वयविराजिता","Maanikyamakutaaka     const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
  }
  function noise(g, w, h, n, cols, rmin, rmax, a) {
    for (let i = 0; i < n; i++) {
      g.globalAlpha = a * Math.random(); g.fillStyle = cols[(Math.random() * cols.length) | 0];
      g.beginPath(); g.ellipse(Math.random() * w, Math.random() * h, rnd(rmin, rmax), rnd(rmin, rmax) * rnd(.4, 1), rnd(0, 3), 0, 7); g.fill();
    }
    g.globalAlpha = 1;
  }
  const mudTex = cvs(512, 512, (g, w, h) => {
    g.fillStyle = "#9a6a45"; g.fillRect(0, 0, w, h);
    noise(g, w, h, 900, ["#b07a4f", "#86593a", "#a36f48", "#c08a5c", "#7a4f33"], 4, 30, .35);
    g.strokeStyle = "rgba(60,35,20,.25)"; g.lineWidth = 1;
    for (let i = 0; i < 60; i++) { g.beginPath(); const y = Math.random() * h; g.moveTo(0, y); g.bezierCurveTo(w * .3, y + rnd(-20, 20), w * .6, y + rnd(-20, 20), w, y + rnd(-10, 10)); g.stroke(); }
  });
  mudTex.wrapS = mudTex.wrapT = THREE.RepeatWrapping; mudTex.repeat.set(3, 1.5);

    noise(g, w, h, 300, ["#9b3b26", "#73281a", "#a2442b"], 3, 16, .4);
    g.fillStyle = "#efe2c8"; g.fillRect(0, 6, w, 4);
    for (let x = 16; x < w; x += 32) {
      g.beginPath(); g.arc(x, 34, 4, 0, 7); g.fill();
      g.beginPath(); g.moveTo(x - 12, 62); g.lineTo(x, 46); g.lineTo(x + 12, 62); g.closePath(); g.globalAlpha = .9; g.fill(); g.globalAlpha = 1;
    }
  });
  geruTex.wrapS = THREE.RepeatWrapping; geruTex.repeat.set(3, 1);
  const floorTex = cvs(512, 512, (g, w, h) => {
    g.fillStyle = "#4e3a28"; g.fillRect(0, 0, w, h);
    noise(g, w, h, 600, ["#5c4630", "#43311f", "#5a4a2e", "#3b2b1b"], 6, 40, .4);
    g.strokeStyle = "rgba(30,20,10,.35)"; g.lineWidth = 2;
    for (let i = 0; i < 40; i++) { g.beginPath(); g.arc(Math.random() * w, Math.random() * h, rnd(20, 70), rnd(0, 3), rnd(3, 6)); g.stroke(); }
  });
  floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(4, 4);
  const thatchTex = cvs(512, 512, (g, w, h) => {

      const x = Math.random() * w, y = Math.random() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd(-6, 6), y + rnd(30, 80)); g.stroke();

  const ASSETS = window.SADHANA_ASSETS || {};
  const loadTex = (src) => { const t = new THREE.TextureLoader().load(src); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; };
  const yantraTex = loadTex(ASSETS.yantra);
  const lalitaTex = loadTex(ASSETS.lalita);
  const guruTex = ASSETS.guru ? loadTex(ASSETS.guru) : null;
  const ganeshTex = cvs(512, 512, (g, W) => {

    g.fillStyle = grad; g.beginPath(); g.arc(c, c, c - 6, 0, 7); g.fill();
    g.strokeStyle = "#f2c25f"; g.lineWidth = 12; g.beginPath(); g.arc(c, c, c - 14, 0, 7); g.stroke();

    g.font = "220px 'Tiro Devanagari Sanskrit', 'Kohinoor Devanagari', serif"; g.fillText("गं", c, c - 10);
    g.font = "44px 'Tiro Devanagari Sanskrit', 'Kohinoor Devanagari', serif"; g.fillText("श्री गणेशाय नमः", c, c + 150);

  const radial = (stops) => cvs(128, 128, (g) => { const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); });
  const flameTex = cvs(128, 256, (g) => {

  });
  const glowTex = radial([[0, "rgba(255,200,110,.9)"], [.3, "rgba(255,150,60,.35)"], [1, "rgba(255,120,40,0)"]]);

    g.fillStyle = "#fff"; for (let i = 0; i < 70; i++) { g.globalAlpha = Math.random(); g.fillRect(Math.random() * w, Math.random() * h * .8, 1.5, 1.5); }
    g.globalAlpha = 1; const m = g.createRadialGradient(180, 60, 2, 180, 60, 40); m.addColorStop(0, "#fffbe8"); m.addColorStop(.3, "rgba(255,250,220,.6)"); m.addColorStop(1, "rgba(255,250,220,0)"); g.fillStyle = m; g.fillRect(0, 0, w, h);

<script>// Sadhana app: state, storage, home, session, vidhi, naamavali, yatra.
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- roman style ----------
  const simple = (s) => s.replace(/ā/g, "aa").replace(/Ā/g, "Aa").replace(/ī/g, "ee").replace(/Ī/g, "Ee").replace(/ū/g, "oo").replace(/Ū/g, "Oo")

  // ---------- audio ----------
  let AC = null, droneNodes = null;
  const ac = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (AC.state === "suspended") AC.resume(); return AC; };
  function bell() {
    window.Hut?.ringBell();
    if (!state.prefs.bell) return; const a = ac(); if (!a) return; const t = a.currentTime;
    const out = a.createGain(); out.gain.value = .16; out.connect(a.destination);
    [[1, .6, 3.2], [2.0, .35, 2.2], [2.76, .3, 1.6], [5.4, .14, 1], [8.9, .06, .6]].forEach(([r, g, d]) => {
      const o = a.createOscillator(), e = a.createGain(); o.type = "sine"; o.frequency.value = 640 * r * (1 + (Math.random() - .5) * .004);
      e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(g, t + .005); e.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(e); e.connect(out); o.start(t); o.stop(t + d + .1);
    });
  }
  function setDrone(on) {
    if (!on) { if (droneNodes) { const a = ac(); droneNodes.g.gain.linearRampToValueAtTime(0, a.currentTime + 1.2); const n = droneNodes; setTimeout(() => n.osc.forEach((o) => o.stop()), 1400); droneNodes = null; } return; }
    const a = ac(); if (!a || droneNodes) return;
    const g = a.createGain(); g.gain.value = 0; const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700; lp.connect(g); g.connect(a.destination);
    const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = .07; lg.gain.value = 250; lfo.connect(lg); lg.connect(lp.frequency);
    const osc = [130.81, 196.0, 261.63, 130.81 * 1.003].map((f, i) => { const o = a.createOscillator(); o.type = i === 1 ? "triangle" : "sawtooth"; o.frequency.value = f; const og = a.createGain(); og.gain.value = i === 1 ? .5 : .25; o.connect(og); og.connect(lp); o.start(); return o; });
    lfo.start(); osc.push(lfo); g.gain.linearRampToValueAtTime(.05, a.currentTime + 2.5); droneNodes = { g, osc };
  }

  function archiveSankalp() {

  // =========================================================
  // SESSION: every step is a few "pages", one thing on screen at a time
  // =========================================================
  let sess = null, steps = [], tick = null, paused = false;
  function startSession(opts = {}) {
    const s = S(), st = status(); ac();
    const dayNo = st.dayNo;
    if (opts.extra) {
      steps = STEPS.filter((x) => x.id === "paath");
      sess = { key: st.today, extra: true, i: 0, li: 0, c: 0, cnt: 0, paaths: [], cur: 0, page: 0, el: 0, st: {}, started: Date.now(), prep: false, target: 1 };
    } else {
      steps = stepsForDay(dayNo);
      if (s.session && s.session.key === st.today) sess = s.session;
      else { sess = { key: st.today, i: 0, li: 0, c: 0, cnt: 0, paaths: [], cur: 0, page: 0, el: 0, st: {}, started: Date.now(), prep: true, target: s.sankalp.paathPerDay }; s.session = sess; }
    }
    sess.dayNo = dayNo;
    $("#app").hidden = true; $("#session").hidden = false; paused = false;
    window.Hut?.layout("side");
    const idx = (id) => steps.findIndex((x) => x.id === id);
    const at = sess.prep ? -1 : sess.i;
    window.Hut?.set({ doors: opts.extra || at > idx("dwaar"), lamp: opts.extra || at >= idx("deep"), smoke: opts.extra || at > idx("panchpooja"), yantra: .25, ganesh: 0, instant: true });
    keepAwake(true); if (state.prefs.drone) setDrone(true);
    clearInterval(tick); tick = setInterval(onTick, 1000);
    renderSession(true);
  }
  function onTick() {
    if (!sess || paused || document.hidden) return;
    sess.el++; const step = steps[sess.i];
    if (!sess.prep && step) { sess.st[step.id] = (sess.st[step.id] || 0) + 1; if (step.mode === "paath") sess.cur++; }
    updateClock(); if (sess.el % 15 === 0 && !sess.extra) save();
  }
  function remainingEst() {
    let r = 0;
    steps.forEach((st, i) => {
      if (i < sess.i) return;
      const full = st.mode === "paath" ? paathSec() * Math.max(0, sess.target - sess.paaths.length) - (i === sess.i ? sess.cur : 0) : (avgStep(st.id) ?? st.est);
      r += i === sess.i && st.mode !== "paath" ? Math.max(15, full - (sess.st[st.id] || 0)) : Math.max(0, full);
    });
    return r;
  }
  function updateClock() {
    const t = $("#s-el"); if (!t) return;
    t.textContent = fmtClock(sess.el);
    $("#s-rem").textContent = `about ${fmtDur(remainingEst())} left`;
    const pt = $("#p-cur"); if (pt) pt.textContent = fmtClock(sess.cur);
  }
  function exitSession() {
    clearInterval(tick); keepAwake(false); setDrone(false);
    if (sess && !sess.extra) { S().session = sess; save(true); }
    sess = null; $("#session").hidden = true; $("#app").hidden = false;
    window.Hut?.set({ doors: true, lamp: true, smoke: true, yantra: .25, ganesh: 0 }); window.Hut?.goto("home"); setView("home");
  }

  const handSVG = (f) => {

    return `<svg viewBox="0 0 120 140" aria-hidden="true"><g stroke="rgba(244,231,212,.5)" stroke-width="1.5">

      <rect x="4" y="70" width="20" height="46" rx="10" transform="rotate(-32 14 93)" fill="${on(0)}"/>
      <rect x="30" y="16" width="14" height="52" rx="7" fill="${on(1)}"/><rect x="47" y="6" width="14" height="60" rx="7" fill="${on(2)}"/>
      <rect x="64" y="12" width="14" height="55" rx="7" fill="${on(3)}"/><rect x="81" y="30" width="13" height="42" rx="6.5" fill="${on(4)}"/></g></svg>`;

      ${dot(60, 100, k === 0)}${dot(60, 24, k === 1)}${dot(72, 18, k === 2)}${dot(34, 82, k === 3)}${dot(86, 82, k === 3)}
      ${dot(52, 40, k === 4)}${dot(68, 40, k === 4)}${dot(60, 32, k === 4)}
      ${k === 5 || k === 6 ? `<circle cx="60" cy="40" r="32" fill="none" stroke="var(--haldi)" stroke-width="2" stroke-dasharray="${k === 6 ? "4 6" : "60 200"}"><animateTransform attributeName="transform" type="rotate" from="0 60 40" to="360 60 40" dur="${k === 6 ? 6 : 2}s" repeatCount="indefinite"/></circle>` : ""}</svg>`;

  function mantraHTML(m) {
    return `<div class="mantra">${m.k ? `<div class="k">${esc(m.k)}</div>` : ""}<div class="d">${esc(m.d)}</div>${state.prefs.showRoman && m.r ? `<div class="r">${esc(rom(m.r))}</div>` : ""}${m.note ? `<div class="note">→ ${esc(m.note)}</div>` : ""}</div>`;

  // Break a step into pages of at most two lines of mantra each
  function chunk(d, r, n = 2) {
    const D = d.split("\n"), Rr = r.split("\n"), out = [];
    for (let i = 0; i < D.length; i += n) out.push({ d: D.slice(i, i + n).join("\n"), r: Rr.slice(i, i + n).join("\n") });
    return out;
  }
  function pagesFor(step) {
    if (step.mode === "paath") return [{ paath: true }];
    if (step.mode === "count") return [{ d: step.m[0].d, r: step.m[0].r, counter: "count" }];
    if (step.mode === "sankalp") {
      const sk = S().sankalp;
      const dev = SANKALP.d({ ...sk, days: toDeva(sk.days) }).split("।").map((x) => x.trim()).filter(Boolean).map((x) => x + "।");
      const en = SANKALP.r(sk).split(/(?<=\.)\s+(?=[A-Z])/);
      return dev.length === en.length ? dev.map((d, i) => ({ d, en: en[i], long: true })) : [{ d: dev.join("\n"), en: en.join(" "), long: true }];
    }
    if (step.mode === "single") {
      return step.m.flatMap((m) => { const cs = chunk(m.d, m.r); if (m.note) cs[cs.length - 1].how = m.note; return cs; });
    }
    // lines
    const g = step.group || 1;
    if (g > 1) {
      const out = [];
      for (let i = 0; i < step.lines.length; i += g) { const part = step.lines.slice(i, i + g); out.push({ d: part.map((l) => l.d).join("\n"), r: part.map((l) => l.r).join("\n") }); }
      return out;
    }
    return step.lines.flatMap((l, li) => chunk(l.d, l.r).map((c, ci) => ({
      ...c, k: l.k, how: l.how, fx: ci === 0 ? l.fx : undefined, counter: l.counter ? "tap" : undefined,

    el.innerHTML = `<div><div class="eyebrow">Journey</div><h1>${st.doneCount} of ${sk.days} lamps lit</h1></div>
      <div class="stats"><div class="stat"><b class="num">${st.streak}</b><span>Day streak</span></div><div class="stat"><b class="num">${st.totals.paath}</b><span>Recitations</span></div><div class="stat"><b class="num">${fmtDur(st.totals.sec)}</b><span>Total time</span></div></div>
      <div class="sec-h"><h2>Days of your sankalpa</h2><span class="n">from ${fmtDate(sk.startKey)} · the day changes at ${dayStart()}:00 AM</span></div><div class="cal">${cells}</div>
      <div class="sec-h"><h2>Milestones</h2><span class="n">${on.length} / ${MEDALS.length}</span></div>
      <div class="medals">${MEDALS.map((m) => `<div class="medal ${on.includes(m[1]) ? "on" : ""}"><span class="g">${m[0]}</span><b>${esc(m[1])}</b><span>${esc(m[2])}</span></div>`).join("")}</div>
      <div class="sec-h"><h2>Where the time goes</h2><span class="n">average of the last ${recent.length || 0} days</span></div>
      ${bars ? `<div class="bars">${bars}</div>` : `<p class="hint">After your first sadhana, the time for each part will show here.</p>`}
      <div class="sec-h"><h2>History</h2></div>
      <div class="hist">${logs.slice().reverse().map((l) => `<div><b>${fmtDate(l.k)} · Day ${l.day || ""}</b><span class="num">${fmtDur(l.total)} · ${l.paaths?.length || 0} recitations</span></div>`).join("") || `<p class="hint">No day completed yet.</p>`}
      ${s.history.map((hh) => `<div><b>Earlier sankalpa from ${fmtDate(hh.startKey)}</b><span>${hh.done} / ${hh.days} days</span></div>`).join("")}</div>`;
  }

  // =========================================================
  // SETTINGS
  // =========================================================
  function openSettings() {
    const p = state.prefs, sk = S().sankalp;
    const o = document.createElement("div"); o.className = "overlay";
    const sw = (id, on, label) => `<div class="toggle"><span>${label}</span><button class="sw ${on ? "on" : ""}" id="${id}" role="switch" aria-checked="${!!on}" aria-label="${esc(label)}"></button></div>`;
    o.innerHTML = `<div class="dialog"><h2>Settings</h2>
      <div class="sheet-sec"><h3>Mantra</h3>
        ${sw("o-rom", p.showRoman, "Show Roman transliteration")}
        <div class="field"><label>Transliteration style</label><div class="seg" id="o-style"><button data-v="simple" class="${p.roman === "simple" ? "on" : ""}">Simple (easy to read)</button><button data-v="iast" class="${p.roman === "iast" ? "on" : ""}">IAST (scholarly)</button></div></div>
        <div class="field"><label for="o-scale">Mantra text size</label><input id="o-scale" type="range" min=".85" max="1.5" step=".05" value="${p.scale}"></div></div>
      <div class="sheet-sec"><h3>Sound</h3>${sw("o-bell", p.bell, "Bell at each step")}${sw("o-drone", p.drone, "Soft tanpura drone during sadhana")}</div>
      ${sk ? `<div class="sheet-sec"><h3>Sankalpa</h3>
        <div class="grid2"><div class="field"><label for="o-paath">Recitations per day</label><input id="o-paath" type="number" min="1" max="21" value="${sk.paathPerDay}"></div>
        <div class="field"><label for="o-pmin">One recitation (min)</label><input id="o-pmin" type="number" min="8" max="60" value="${sk.paathMin}"></div></div>
        <div class="grid2"><div class="field"><label for="o-days">Total days</label><input id="o-days" type="number" min="1" max="120" value="${sk.days}"></div>
        <div class="field"><label for="o-ds">Day changes at (AM)</label><input id="o-ds" type="number" min="0" max="6" value="${sk.dayStart}"></div></div>
        <div class="field"><label for="o-name">Name</label><input id="o-name" value="${esc(sk.name)}"></div>
        <div class="grid2"><div class="field"><label for="o-gotra">Gotra</label><input id="o-gotra" value="${esc(sk.gotra)}"></div><div class="field"><label for="o-dob">Date of birth</label><input id="o-dob" value="${esc(sk.dob)}"></div></div>
        <div class="field"><label for="o-wish">Wish / intention</label><textarea id="o-wish" rows="2">${esc(sk.wish)}</textarea></div>
        <p class="hint">Your time per recitation is learned automatically from your real timings; this number is only the starting estimate.</p>
        ${sess ? "" : `<div class="restart"><p class="hint">Missed days, or want a fresh start?</p><button class="btn btn-ghost btn-sm" id="o-restart">Cancel and restart sankalpa</button></div>`}</div>` : ""}
      <div class="sheet-sec"><h3>Backup</h3><p class="hint">${syncMode === "cloud" ? "Your progress is synced to your account." : "Your progress is stored only on this device. Copy a backup to keep it safe."}</p>
        <div class="row"><button class="btn btn-ghost btn-sm" id="o-copy">Copy backup</button><button class="btn btn-ghost btn-sm" id="o-imp">Paste backup</button></div>
        <textarea class="backup" id="o-bk" hidden placeholder="Paste backup JSON here"></textarea></div>
      <div class="sheet-sec"><h3>Image credits</h3>${CREDITS.map((c) => `<p class="hint">${esc(c)}</p>`).join("")}</div>
      <button class="btn btn-gold btn-block" id="o-ok">Save</button></div>`;
    document.body.appendChild(o);
    const tg = (id, key, after) => { $("#" + id, o).onclick = (e) => { p[key] = !p[key]; e.currentTarget.classList.toggle("on", p[key]); e.currentTarget.setAttribute("aria-checked", p[key]); after?.(); }; };
    tg("o-rom", "showRoman"); tg("o-bell", "bell", () => p.bell && bell()); tg("o-drone", "drone", () => { if (sess) setDrone(p.drone); });
    o.querySelectorAll("#o-style button").forEach((b) => b.onclick = () => { p.roman = b.dataset.v; o.querySelectorAll("#o-style button").forEach((x) => x.classList.toggle("on", x === b)); });
    $("#o-scale", o).oninput = (e) => { p.scale = +e.target.value; applyPrefs(); };
    $("#o-restart", o)?.addEventListener("click", () => openRestart(o));
    $("#o-copy", o).onclick = async () => { const t = JSON.stringify(state); try { await navigator.clipboard.writeText(t); toast("Backup copied"); } catch (e) { const ta = $("#o-bk", o); ta.hidden = false; ta.value = t; ta.select(); toast("Text selected. Copy it manually."); } };
    $("#o-imp", o).onclick = () => { const ta = $("#o-bk", o); if (ta.hidden) { ta.hidden = false; ta.value = ""; ta.focus(); return; } try { const d = JSON.parse(ta.value); if (!d.sadhanas) throw 0; state = Object.assign(fresh(), d); save(true); o.remove(); rerender(); toast("Backup restored"); } catch (e) { toast("That does not look like a valid backup"); } };
    $("#o-ok", o).onclick = () => {
      if (sk) {
        const v = (id) => $(id, o).value.trim();
        Object.assign(sk, { paathPerDay: Math.max(1, Math.min(21, Math.round(+v("#o-paath")) || sk.paathPerDay)), paathMin: Math.max(8, Math.min(60, +v("#o-pmin") || 22)), days: Math.max(1, Math.min(120, +v("#o-days") || sk.days)), dayStart: Math.max(0, Math.min(6, +v("#o-ds") || 0)), name: v("#o-name"), gotra: v("#o-gotra"), dob: v("#o-dob"), wish: v("#o-wish") });
        if (S().session) S().session.target = Math.max(sk.paathPerDay, S().session.paaths?.length || 0);
      }
      save(true); applyPrefs(); o.remove(); rerender(); toast("Saved");
    };
    o.addEventListener("click", (e) => { if (e.target === o) { applyPrefs(); o.remove(); } });
  }
  function applyPrefs() { document.documentElement.style.setProperty("--mantra-scale", state.prefs.scale || 1); }
  function rerender() { applyPrefs(); if (sess) renderSession(false); else setView(view); }

  // ---------- boot ----------
  document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => setView(b.dataset.v));
  $("#b-settings").onclick = openSettings;
  $("#h-darshan img").src = A.lalita; $("#h-darshan").onclick = openDarshan;
  if (EMBED) { const x = $("#b-exit"); x.hidden = false; x.onclick = () => window.parent.postMessage({ type: "lalita:exit" }, location.origin); }
  // a session left over from an earlier day becomes a partial log
  { const s = S(); if (s.session && s.session.key !== todayKey() && s.sankalp) { if (!s.logs[s.session.key]) s.logs[s.session.key] = { status: "partial", steps: s.session.st, paaths: s.session.paaths, total: s.session.el, start: s.session.started }; s.session = null; save(); } }
  applyPrefs(); renderSync(); setView(location.hash === "#vidhi" ? "vidhi" : location.hash === "#naam" ? "naam" : location.hash === "#yatra" ? "yatra" : "home");
  setInterval(() => { if (!sess && view === "home" && S().sankalp) renderHome(); }, 60000);
  initCloud();
})();
</script>
</body></html>
